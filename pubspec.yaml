name: docnook
description: "DocNook: offline document suite for Android"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

# Every package is recorded in docs/decisions.md with its version, license,
# last publish date and manifest permissions (CLAUDE.md rule 3).
dependencies:
  archive: ^4.6.0
  camera: 0.12.2
  crypto: ^3.0.8
  drift: ^2.35.4
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  google_mlkit_document_scanner: 0.7.2
  google_mlkit_text_recognition: 1.0.3
  image: 4.12.0
  intl: ^0.20.3
  markdown: ^7.3.1
  meta: ^1.19.0
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  pdfium_dart: ^0.4.1
  pdfrx: ^2.12.0
  pointycastle: ^4.0.0
  two_dimensional_scrollables: ^0.5.6
  xml: ^7.1.0

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/licenses/
    # Fonts embedded in converted PDFs (Latin, Greek, Cyrillic subsets).
    - assets/docfonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4-SemiBold.ttf
          weight: 600
    # Phosphor Icons (MIT). Only the glyphs in lib/design_system/icons.dart
    # survive release builds (icon tree-shaking).
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/Phosphor-Regular.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
    - family: PhosphorBold
      fonts:
        - asset: assets/fonts/Phosphor-Bold.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
