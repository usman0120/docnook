name: docnook
description: "DocNook: offline document suite for Android"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

# Every package is recorded in docs/decisions.md with its version, license,
# last publish date and manifest permissions (CLAUDE.md rule 3).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/licenses/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4-SemiBold.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
