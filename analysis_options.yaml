include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - "**/*.g.dart"
    - "lib/app/l10n/generated/**"
  errors:
    # Generated code and long literal tables in parsers read better unwrapped.
    lines_longer_than_80_chars: ignore

linter:
  rules:
    # Public API docs are required in domain/ and engines/ by review, not by
    # lint: widgets and screens are self-describing.
    public_member_api_docs: false
    # Tests and parsers use short, local helper names.
    avoid_positional_boolean_parameters: false
    # `final class` with private constructors is used for value types.
    sort_constructors_first: false
    # Parsers expose `read(pull, element)` helpers that return partial props;
    # they are not constructors by intent.
    prefer_constructors_over_static_methods: false
    # Test fixtures concatenate XML fragments deliberately.
    missing_whitespace_between_adjacent_strings: false
    no_adjacent_strings_in_list: false
    specify_nonobvious_property_types: false
    prefer_foreach: false
    # The rules below are style advice that fights the code more than it
    # helps: int literals turn math.min/max results into `num`, and a few
    # small async stat() calls are clearer than their sync twins.
    prefer_int_literals: false
    avoid_slow_async_io: false
    avoid_multiple_declarations_per_line: false
    use_setters_to_change_properties: false
    comment_references: false
    cascade_invocations: false
